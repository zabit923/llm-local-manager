---
services:
  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: docker/Dockerfile.cert
    ports:
      - "80:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - /var/www/certbot/:/var/www/certbot/:ro
    environment:
      - HOST=binrt.ru
    command: sh -c "envsubst '$${HOST}' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: always
    networks:
      - app_network

  certbot:
    image: certbot/certbot:v3.0.0
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/:rw
      - /var/www/certbot/:/var/www/certbot/:rw
    networks:
      - app_network

networks:
  app_network:
