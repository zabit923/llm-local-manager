---
x-fastapi-common: &fastapi-common
  build:
    context: .
    dockerfile: docker/Dockerfile.back
  volumes:
    - .:/payolin
    - venv_data:/payolin/.venv
  env_file: .env
  depends_on:
    db_postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - app_network
  restart: always

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local_llm_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - app_network
    restart: unless-stopped

  backend:
    <<: *fastapi-common
    container_name: backend
    environment:
      LLM_BASE_URL: http://host.docker.internal:8000/v1
      LLM_MODEL: Qwen/Qwen3-8B-AWQ
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn src.entrypoint.main:create_app --host 0.0.0.0 --port 8888 --reload"
    healthcheck:
      test: curl -f http://localhost:8888/api/v1/pub/healthcheck/ || exit 1
      interval: 20s
      retries: 3
      start_period: 30s
    ports:
      - "8088:8888"

  taskiq_worker:
    <<: *fastapi-common
    container_name: taskiq_worker
    command: >
      sh -c "taskiq worker --ack-type when_executed src.entrypoint.config.taskiq:create_taskiq_app src.application.tasks"

  taskiq_scheduler:
    <<: *fastapi-common
    container_name: taskiq_scheduler
    command: >
      sh -c "taskiq scheduler src.entrypoint.config.taskiq:create_taskiq_scheduler src.application.tasks"

  db_postgres:
    container_name: db_postgres
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    networks:
      - app_network
    volumes:
      - application_db:/var/lib/postgresql/data/
      - ./init_scripts:/docker-entrypoint-initdb.d/
    healthcheck:
      test: "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
      interval: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.0.5-alpine
    hostname: redis
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app_network
    restart: always

volumes:
  application_db:
  venv_data:

networks:
  app_network:
