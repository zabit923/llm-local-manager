<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Гиро — голосовой заказ</title>
  <link rel="stylesheet" href="/styles.css?v=final-1" />
</head>
<body>
  <main class="app-shell">
    <section class="voice-panel">
      <div class="voice-content">
        <p id="status" class="screen-reader-only" aria-live="polite"></p>
        <button id="talk" class="talk-button" aria-label="Начать разговор">
          <span class="mic-icon" aria-hidden="true"></span>
          <span id="talk-label" class="talk-label">Начать разговор</span>
        </button>
        <span id="orb-label" class="screen-reader-only"></span>
        <canvas
          id="audio-visualizer"
          class="audio-visualizer"
          aria-label="Визуализация звука"
        ></canvas>
      </div>
    </section>
    <aside class="orders-panel">
      <div class="orders-header">
        <h2>Заказы</h2>
        <button id="refresh" class="refresh" aria-label="Обновить заказы">
          Обновить
        </button>
      </div>
      <div id="orders-list" class="orders-list">
        <p class="muted">Загрузка…</p>
      </div>
    </aside>
  </main>
  <script src="/app.js?v=local-audio-1"></script>
</body>
</html>
