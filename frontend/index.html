<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Гиро — голосовой заказ</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="voice-panel">
      <div class="brand"><span class="brand-dot"></span> ГИРО</div>
      <div class="voice-content">
        <p class="eyebrow">Голосовой менеджер заказов</p>
        <h1>Ваш заказ —<br /><span>в одном разговоре</span></h1>
        <p id="status" class="status">Нажмите на сферу, чтобы начать разговор</p>
        <button id="talk" class="orb-button" aria-label="Начать разговор">
          <span class="orb-glow"></span>
          <span class="orb-core"></span>
          <span class="orb-ring orb-ring-one"></span>
          <span class="orb-ring orb-ring-two"></span>
        </button>
        <span id="orb-label" class="orb-label">Начать разговор</span>
      </div>
      <p class="hint">Нажмите ещё раз, чтобы завершить звонок</p>
    </section>
    <aside class="orders-panel">
      <div class="orders-header">
        <div>
          <p class="eyebrow">История</p>
          <h2>Заказы</h2>
        </div>
        <button id="refresh" class="refresh" aria-label="Обновить заказы">↻</button>
      </div>
      <div id="orders-list" class="orders-list">
        <p class="muted">Загрузка…</p>
      </div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
