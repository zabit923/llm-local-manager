---
x-fastapi-common: &fastapi-common
  build:
    context: .
    dockerfile: docker/Dockerfile.back
    target: runtime
  env_file: .env
  depends_on:
    db_postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - app_network
    - public_network
  restart: always

services:
  backend:
    <<: *fastapi-common
    container_name: backend
    command: >
      sh -c "uvicorn src.entrypoint.main:create_app --host 0.0.0.0 --port 8888"
    healthcheck:
      test: curl -f http://localhost:8888/api/v1/pub/healthcheck/ || exit 1
      interval: 20s
      retries: 3
      start_period: 30s

  taskiq_worker:
    <<: *fastapi-common
    container_name: taskiq_worker
    command: >
      sh -c "taskiq worker --ack-type when_executed src.entrypoint.config.taskiq:create_taskiq_app src.application.tasks"

  taskiq_scheduler:
    <<: *fastapi-common
    container_name: taskiq_scheduler
    command: >
      sh -c "taskiq scheduler src.entrypoint.config.taskiq:create_taskiq_scheduler src.application.tasks"

  db_postgres:
    container_name: db_postgres
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    networks:
      - app_network
    volumes:
      - application_db:/var/lib/postgresql/data/
      - ./init_scripts:/docker-entrypoint-initdb.d/
    healthcheck:
      test: "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
      interval: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - /var/www/certbot/:/var/www/certbot/:ro
      - nginx_logs:/var/log/nginx
    environment:
      - HOST=${HOST}
    command: sh -c "envsubst '$${HOST}' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - public_network
      - app_network

  certbot:
    image: certbot/certbot:v3.0.0
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/:rw
      - /var/www/certbot/:/var/www/certbot/:rw
    container_name: certbot
    networks:
      - app_network
      - public_network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    networks:
      - app_network
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --port ${REDIS_PORT}
    restart: always

volumes:
  application_db:
  nginx_logs:

networks:
  public_network:
  app_network:
    internal: true
